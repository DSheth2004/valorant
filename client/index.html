<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valorant Hub — Agents, Maps, Arsenal & Store</title>
    <meta
      name="description"
      content="A full-stack Valorant fan hub. Explore agents, maps and weapons, then sign in to shop the daily store with your VP wallet."
    />
    <meta name="theme-color" content="#0f1923" />
    <meta property="og:title" content="Valorant Hub" />
    <meta property="og:description" content="Explore agents, maps and the arsenal, and shop the daily store." />
    <meta property="og:image" content="/assets/brand/agents-lineup.webp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("vh-theme");
          theme = saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>Valorant Hub needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
